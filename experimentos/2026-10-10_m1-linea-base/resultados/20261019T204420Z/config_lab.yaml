  - deje su mensaje
  - grabe su mensaje
  - para enviar el mensaje
  - seguir las instrucciones
  late_pair_corroborators:
  - tono
  - senal
  - presione
  - presiona
  - numeral
  - almohadilla
  - grabar
  - grabacion
  machine_phrases:
  - buzon de voz
