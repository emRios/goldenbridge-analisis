  - se rindio al buzon
  - se rendio al buzon
  - se reenvio al buzon
  - redirigido al buzon
  - te ha redirigido al buzon
  - tu llamada se
  - deje su mensaje
  - deja tu mensaje
  - grabe su mensaje
  - graba tu mensaje
  - despues del tono
  - despues de la senal
  - luego del tono
